{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5"> 
    <h1>Login to continue...</h1>

    <div>
      {%if messages %}
          {% for message in messages %}
               {{message}}
          {% endfor%} 
      {% endif %}

    </div>

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3 mb-3">Login</button>
    </form>
    <p style="color: grey; font-size: small;" class="mb-2">Don't have an account? Create one below.</p>
    <a href="{% url 'users:sign_up'%}" class="btn btn-outline-primary">Create new account </a>

    

</body>
</html>
